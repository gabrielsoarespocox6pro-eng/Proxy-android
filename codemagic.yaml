workflows:

  proxy-android-debug:
  
    name: Proxy Android 1.0.9 - APK de teste
    
    max_build_duration: 60
    
    scripts:
    
      - name: Extrair e compilar o projeto Android
      
        script: |
        
          set -e
          
          test -f proxy-android.zip
          
          rm -rf source
          
          mkdir -p source
          
          unzip -q proxy-android.zip -d source
          
          project_root="$(find source -maxdepth 3 -type f -name package.json -printf '%h\n' | head -n 1)"
          
          test -n "$project_root"
          
          cd "$project_root"
          
          npm install --global pnpm@9.12.0
          
          pnpm install --frozen-lockfile
          
          if [ ! -f android/gradlew ]; then
          
            npx expo prebuild --platform android --no-install
            
          fi
          
          chmod +x android/gradlew
          
          cd android
          
          ./gradlew assembleDebug --no-daemon
          
    artifacts:
    
      - source/**/android/app/build/outputs/apk/debug/app-debug.apk
      
      - source/**/android/app/build/outputs/apk/debug/*.apk























